<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acompanhamentos</title>
  <link rel="icon" type="image/x-icon" href="./assets/burger.png">
  <link rel="stylesheet" href="acompanhamentos.css" />
</head>

<body>
  <a href="./menu.html">
    <img src="./assets/arrow_back.svg" alt="Voltar" id="home" />
  </a>

  <div class="container">
  <h1 class="section-title">Acompanhamentos</h1>

  <div class="free-item">
    <span class="icon">🍟</span>
    <span class="text">Uma porção de batata frita por nossa conta</span>
  </div>

  <div class="items">

    <!-- MOLHOS -->
    <label class="item">
      <div class="item-info">
        <span class="item-name">Molho Extra</span>
        <span class="item-price">R$ 4,00</span>
      </div>

      <span class="item-desc">
        Maionese de alho
      </span>

      <div class="quantity-control">
        <button type="button" onclick="changeQuantity(this, -1)">➖</button>
        <span>0</span>
        <button type="button" onclick="changeQuantity(this, 1)">➕</button>
      </div>
    </label>

    <!-- BATATA EXTRA -->
    <label class="item">
      <div class="item-info">
        <span class="item-name">Porção Extra de Batata</span>
        <span class="item-price">R$ 7,00</span>
      </div>

      <div class="quantity-control">
        <button type="button" onclick="changeQuantity(this, -1)">➖</button>
        <span>0</span>
        <button type="button" onclick="changeQuantity(this, 1)">➕</button>
      </div>
    </label>

    <!-- ONION RINGS -->
    <label class="item">
      <div class="item-info">
        <span class="item-name">Onion Rings </span>
        <span class="item-price">R$ 8,00</span>
      </div>

      <span class="item-desc">
        Anéis de cebola empanados e crocantes
      </span>

      <div class="quantity-control">
        <button type="button" onclick="changeQuantity(this, -1)">➖</button>
        <span>0</span>
        <button type="button" onclick="changeQuantity(this, 1)">➕</button>
      </div>
    </label>

    <!-- NUGGETS -->
    <label class="item">
      <div class="item-info">
        <span class="item-name">Nuggets de frango </span>
        <span class="item-price">R$ 10,00</span>
      </div>

      <span class="item-desc">
        Crocantes por fora e macios por dentro
      </span>

      <div class="quantity-control">
        <button type="button" onclick="changeQuantity(this, -1)">➖</button>
        <span>0</span>
        <button type="button" onclick="changeQuantity(this, 1)">➕</button>
      </div>
    </label>

    <!-- BATATA COM CHEDDAR E BACON -->
    <label class="item">
      <div class="item-info">
        <span class="item-name">Batata com cheddar e bacon</span>
        <span class="item-price">R$ 14,00</span>
      </div>

      <span class="item-desc">
        Porção de batata frita com cheddar cremoso e bacon crocante
      </span>

      <div class="quantity-control">
        <button type="button" onclick="changeQuantity(this, -1)">➖</button>
        <span>0</span>
        <button type="button" onclick="changeQuantity(this, 1)">➕</button>
      </div>
    </label>

  </div>

    <button class="btn-carrinho">🛒 Adicionar ao Carrinho</button>
  </div>

  <script src="acompanhamentos.js"></script>
</body>
</html>

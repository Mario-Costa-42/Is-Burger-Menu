<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hambúrgueres</title>
  <link rel="icon" type="image/x-icon" href="./assets/burger.png" />
  <link rel="stylesheet" href="hamburguer.css" />
</head>

<body>
  <a href="./menu.html">
    <img src="./assets/arrow_back.svg" alt="Início" id="home" />
  </a>

  <h1 id="MilkshakeTitle">Hambúrgueres</h1>

  <div class="container">
    <h2>Escolha seu hambúrguer</h2>

    <!-- CLÁSSICO SIMPLES -->
    <label class="checkbox-btn">
      <input type="checkbox" />
      <div class="label-content">
        <span>Clássico Simples</span>
        <p class="description">
          Pão brioche, hambúrguer bovino 120g, queijo muçarela, alface,
          tomate e molho especial da casa.
        </p>

        <div class="quantity-control">
          <button type="button" onclick="changeQuantity(this, -1)">➖</button>
          <span>0</span>
          <button type="button" onclick="changeQuantity(this, 1)">➕</button>
        </div>

        <span class="price">R$ 18,00</span>
      </div>
    </label>

    <!-- CHEESEBURGER DUPLO -->
    <label class="checkbox-btn">
      <input type="checkbox" />
      <div class="label-content">
        <span>Cheeseburger Duplo</span>
        <p class="description">
          Pão brioche, dois hambúrgueres 100g, cheddar duplo,
          picles e molho especial.
        </p>

        <div class="quantity-control">
          <button type="button" onclick="changeQuantity(this, -1)">➖</button>
          <span>0</span>
          <button type="button" onclick="changeQuantity(this, 1)">➕</button>
        </div>

        <span class="price">R$ 24,00</span>
      </div>
    </label>

    <!-- BACON SUPREME -->
    <label class="checkbox-btn">
      <input type="checkbox" />
      <div class="label-content">
        <span>Bacon Supreme</span>
        <p class="description">
          Pão brioche, hambúrguer 150g, queijo cheddar,
          bacon crocante e cebola caramelizada.
        </p>

        <div class="quantity-control">
          <button type="button" onclick="changeQuantity(this, -1)">➖</button>
          <span>0</span>
          <button type="button" onclick="changeQuantity(this, 1)">➕</button>
        </div>

        <span class="price">R$ 26,00</span>
      </div>
    </label>

    <!-- CHICKEN CRISPY -->
    <label class="checkbox-btn">
      <input type="checkbox" />
      <div class="label-content">
        <span>Chicken Crispy</span>
        <p class="description">
          Pão brioche, filé de frango empanado, alface,
          tomate e maionese temperada.
        </p>

        <div class="quantity-control">
          <button type="button" onclick="changeQuantity(this, -1)">➖</button>
          <span>0</span>
          <button type="button" onclick="changeQuantity(this, 1)">➕</button>
        </div>

        <span class="price">R$ 20,00</span>
      </div>
    </label>

    <!-- BBQ BURGER -->
    <label class="checkbox-btn">
      <input type="checkbox" />
      <div class="label-content">
        <span>BBQ Burger</span>
        <p class="description">
          Pão brioche, hambúrguer 150g, queijo prato,
          bacon, onion rings e molho barbecue.
        </p>

        <div class="quantity-control">
          <button type="button" onclick="changeQuantity(this, -1)">➖</button>
          <span>0</span>
          <button type="button" onclick="changeQuantity(this, 1)">➕</button>
        </div>

        <span class="price">R$ 28,00</span>
      </div>
    </label>

    <!-- VEGGIE BURGER -->
    <label class="checkbox-btn">
      <input type="checkbox" />
      <div class="label-content">
        <span>Veggie Burger</span>
        <p class="description">
          Pão integral, hambúrguer de grão-de-bico,
          alface, tomate, cenoura ralada e molho vegano.
        </p>

        <div class="quantity-control">
          <button type="button" onclick="changeQuantity(this, -1)">➖</button>
          <span>0</span>
          <button type="button" onclick="changeQuantity(this, 1)">➕</button>
        </div>

        <span class="price">R$ 22,00</span>
      </div>
    </label>

    <!-- EGG BACON BURGER -->
    <label class="checkbox-btn">
      <input type="checkbox" />
      <div class="label-content">
        <span>Egg Bacon Burger</span>
        <p class="description">
          Pão brioche, hambúrguer 150g, queijo cheddar,
          bacon crocante e ovo frito.
        </p>

        <div class="quantity-control">
          <button type="button" onclick="changeQuantity(this, -1)">➖</button>
          <span>0</span>
          <button type="button" onclick="changeQuantity(this, 1)">➕</button>
        </div>

        <span class="price">R$ 27,00</span>
      </div>
    </label>

    <!-- MONSTER BURGER -->
    <label class="checkbox-btn">
      <input type="checkbox" />
      <div class="label-content">
        <span>Monster Burger</span>
        <p class="description">
          Pão brioche, dois hambúrgueres 150g, cheddar duplo,
          bacon, cebola caramelizada e molho especial.
        </p>

        <div class="quantity-control">
          <button type="button" onclick="changeQuantity(this, -1)">➖</button>
          <span>0</span>
          <button type="button" onclick="changeQuantity(this, 1)">➕</button>
        </div>

        <span class="price">R$ 32,00</span>
      </div>
    </label>

    <button class="btn-carrinho" onclick="adicionarCarrinho()">
      🛒 Adicionar ao Carrinho
    </button>
  </div>

  <script>
    function changeQuantity(button, amount) {
      let span = button.parentElement.querySelector("span");
      let value = parseInt(span.textContent) + amount;
      if (value < 0) value = 0;
      span.textContent = value;
    }

    window.onload = function () {
      atualizarBadgeCarrinho();

      let editIndex = localStorage.getItem("editarIndex");
      if (editIndex !== null) {
        let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
        let item = carrinho[editIndex];

        if (item && item.produto === "Hambúrguer") {
          document.querySelectorAll(".checkbox-btn").forEach((burger) => {
            let nome = burger.querySelector(".label-content span").textContent;
            if (item.nome === nome) {
              burger.querySelector(".quantity-control span").textContent =
                item.quantidade;
            }
          });

          document.querySelector(".btn-carrinho").textContent =
            "Salvar Alterações";
        }
      }
    };

    function adicionarCarrinho() {
      let burgers = document.querySelectorAll(".checkbox-btn");
      let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
      let editIndex = localStorage.getItem("editarIndex");

      if (editIndex !== null) {
        carrinho.splice(editIndex, 1);
        localStorage.removeItem("editarIndex");
      }

      burgers.forEach((burger) => {
        let quantidade = parseInt(
          burger.querySelector(".quantity-control span").textContent
        );
        let nome = burger.querySelector(".label-content span").textContent;
        let precoTexto = burger
          .querySelector(".price")
          .textContent.replace("R$", "")
          .replace(",", ".")
          .trim();
        let preco = parseFloat(precoTexto);

        if (quantidade > 0) {
          carrinho.push({
            produto: "Hambúrguer",
            nome: nome,
            quantidade: quantidade,
            preco: preco,
            subtotal: quantidade * preco,
          });
        }
      });

      localStorage.setItem("carrinho", JSON.stringify(carrinho));
      window.location.href = "carrinho.html";
    }
  </script>

  <script src="utils.js"></script>
</body>
</html>
